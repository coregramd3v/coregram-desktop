name: CoreGram Desktop

# Builds CoreGram (AyuGram fork) for Linux and Windows.
# Linux uses the same centos_env docker image already verified locally.
# Windows follows docs/building-win-x64.md on the VS2022 runner.
#
# Set these repo secrets before running (Settings -> Secrets -> Actions):
#   TDESKTOP_API_ID    - your Telegram api_id
#   TDESKTOP_API_HASH  - your Telegram api_hash
# (defaults below are test-only; replace them.)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  API_ID: ${{ secrets.TDESKTOP_API_ID || '2040' }}
  API_HASH: ${{ secrets.TDESKTOP_API_HASH || 'b18441a1ff607e10a989891a5462e627' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Build (centos_env docker)
        run: |
          docker run --rm -u root -v "$PWD:/usr/src/tdesktop" -e CONFIG=Release \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D TDESKTOP_API_ID=$API_ID -D TDESKTOP_API_HASH=$API_HASH \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON
      - name: Package
        run: |
          sudo cp out/Release/CoreGram ./CoreGram
          sudo chown "$(id -u):$(id -g)" ./CoreGram
          strip ./CoreGram || true
          tar czf CoreGram-linux-x64.tar.gz CoreGram
      - uses: actions/upload-artifact@v4
        with:
          name: CoreGram-linux-x64
          path: CoreGram-linux-x64.tar.gz

  windows:
    # Pin to windows-2022 (VS2022 v17) — it ships the VC ATL/MFC components
    # preinstalled, which breakpad needs (atlbase.h). windows-latest moved to a
    # VS18/2026 image without ATL, breaking the libraries build.
    runs-on: windows-2022
    env:
      Platform: x64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          path: tdesktop
      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Ensure ATL is available (breakpad needs atlbase.h)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $ver = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
          $atl = "$vs\VC\Tools\MSVC\$ver\atlmfc"
          if (-not (Test-Path "$atl\include\atlbase.h")) {
            Write-Host "ATL missing at $atl — installing via VS Installer..."
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
            $p = Start-Process -Wait -PassThru -FilePath "$installer\setup.exe" -ArgumentList `
              "modify","--installPath","$vs","--quiet","--norestart","--nocache",`
              "--add","Microsoft.VisualStudio.Component.VC.ATL",`
              "--add","Microsoft.VisualStudio.Component.VC.ATLMFC"
            Write-Host "installer exit: $($p.ExitCode)"
          }
          if (-not (Test-Path "$atl\include\atlbase.h")) {
            throw "atlbase.h still not found at $atl\include — cannot build breakpad"
          }
          Add-Content $env:GITHUB_ENV "INCLUDE=$atl\include;$env:INCLUDE"
          Add-Content $env:GITHUB_ENV "LIB=$atl\lib\x64;$env:LIB"
          Write-Host "ATL OK: $atl"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache built libraries
        id: libcache
        uses: actions/cache@v4
        with:
          path: Libraries
          key: win-x64-libs-${{ hashFiles('tdesktop/Telegram/build/prepare/prepare.py', 'tdesktop/Telegram/build/prepare/win.bat') }}
      - name: Prepare libraries
        if: steps.libcache.outputs.cache-hit != 'true'
        working-directory: tdesktop
        shell: cmd
        run: Telegram\build\prepare\win.bat
      - name: Upload prebuilt libraries (for local builds)
        uses: actions/upload-artifact@v4
        with:
          name: CoreGram-win-x64-Libraries
          path: Libraries
          retention-days: 5
          if-no-files-found: warn
      - name: Configure
        working-directory: tdesktop\Telegram
        shell: cmd
        run: configure.bat x64 -D TDESKTOP_API_ID=%API_ID% -D TDESKTOP_API_HASH=%API_HASH% -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON
      - name: Build
        working-directory: tdesktop
        shell: cmd
        run: cmake --build out --config Release --target Telegram
      - uses: actions/upload-artifact@v4
        with:
          name: CoreGram-win-x64
          path: tdesktop/out/Release/CoreGram.exe
